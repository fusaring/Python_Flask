{% extends "base.html" %}
{% block content %}
<div class="card mb-3">
    <div class="row g-0">
        <div class="col-md-3">
            <img src="{{ book.cover_url or 'https://via.placeholder.com/120x160' }}" class="img-fluid rounded-start" alt="封面">
        </div>
        <div class="col-md-9">
            <div class="card-body">
                <h3>{{ book.title }}</h3>
                <p>作者：{{ book.author }}</p>
                <p>最新章节：{{ book.last_chapter }}</p>
                <p class="text-muted">{{ book.intro or '暂无简介' }}</p>
            </div>
        </div>
    </div>
</div>

<h4>📑 目录</h4>
<div class="list-group">
  {% for ch in catalog %}
    <a href="{{ url_for('read_chapter', book_id=book.id, chapter_index=ch.index) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" target="_blank">
        <span>{{ ch.title }}</span>
        <span class="badge bg-success rounded-pill">免费</span>
    </a>
{% endfor %}
</div>
{% endblock %}
